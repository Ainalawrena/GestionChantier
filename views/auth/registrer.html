<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Construct it</title>

    <link rel="stylesheet" href="styles/register.css">
</head>
<body>

    <header>
        <h1>Construct <span>it</span></h1>
    </header>

    <div class="container">

        <h2>Créer un compte</h2>
        <p>Rejoignez la plateforme de gestion de chantier.</p>

        <form action="index.php?page=auth&action=registrer" method="post">

            <!-- Nom -->
            <div class="form-group">
                <label for="nom">Nom</label>
                <input
                    type="text"
                    id="nom"
                    name="nom"
                    placeholder="Votre nom"
                    required>
            </div>

            <!-- Login -->
            <div class="form-group">
                <label for="login">Login</label>
                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Nom d'utilisateur"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@email.com"
                    required>
            </div>

            <!-- Role -->
            <div class="form-group">
                <label for="role">Rôle</label>
                <select id="role" name="id_role" required>
                    <option value="1">Administrateur</option>
                    <option value="2">Chef de chantier</option>
                    <option value="3">Ouvrier</option>
                    <option value="4">Architecte</option>
                </select>
            </div>

            <!-- Adresse -->
            <div class="form-group full">
                <label for="adresse">Adresse</label>
                <input
                    type="text"
                    id="adresse"
                    name="adresse"
                    placeholder="Votre adresse"
                    required>
            </div>

            <!-- Mot de passe -->
            <div class="form-group full">
                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required>
            </div>

            <input type="submit" value="S'INSCRIRE">

        </form>

    </div>

    <a class="btn-retour" href="index.html">
        ← Retour à l'accueil
    </a>

</body>
</html>
